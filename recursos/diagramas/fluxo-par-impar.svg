<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488.29999999999995 658.3309999999999" width="488.29999999999995" height="658.3309999999999" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="inicio" data-to="entrada" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="240.07450000000003,76.9 240.0745,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="entrada" data-to="decisao" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="240.0745,161.8 240.0745,209.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="decisao" data-to="par" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Sim" points="211.66933333333333,351.8258333333333 211.66933333333333,416.231 130.9995,416.231 130.9995,496.531" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="decisao" data-to="impar" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Não" points="268.4796666666666,351.8258333333334 268.4796666666666,416.231 349.1495,416.231 349.1495,496.531" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="par" data-to="fim" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="130.9995,533.431 130.9995,557.431 240.0745,557.431 240.0745,581.431" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="impar" data-to="fim" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="349.1495,533.431 349.1495,557.431 240.0745,557.431 240.0745,581.431" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="decisao" data-to="par" data-label="Sim">
  <rect x="113.49950000000001" y="423.231" width="34.282" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="130.6405" y="438.381" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Sim</text>
</g>
<g class="edge-label" data-from="decisao" data-to="impar" data-label="Não">
  <rect x="330.6495" y="423.231" width="36.658" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="348.9785" y="438.381" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Não</text>
</g>
<g class="node" data-id="inicio" data-label="Início" data-shape="stadium">
  <rect x="201.31550000000001" y="40" width="77.518" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="240.0745" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Início</text>
</g>
<g class="node" data-id="entrada" data-label="/Ler um número/" data-shape="rectangle">
  <rect x="171.6755" y="124.9" width="136.798" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="240.0745" y="143.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">/Ler um número/</text>
</g>
<g class="node" data-id="decisao" data-label="O resto da divisão
por 2 é zero?" data-shape="diamond">
  <polygon points="240.0745,209.79999999999998 325.28999999999996,295.0155 240.0745,380.231 154.859,295.0155" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="240.0745" y="295.0155" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="240.0745" dy="-3.9000000000000012">O resto da divisão</tspan><tspan x="240.0745" dy="16.900000000000002">por 2 é zero?</tspan></text>
</g>
<g class="node" data-id="par" data-label="Mostrar: o número é par" data-shape="rectangle">
  <rect x="40" y="496.531" width="181.999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="130.9995" y="514.981" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Mostrar: o número é par</text>
</g>
<g class="node" data-id="impar" data-label="Mostrar: o número é ímpar" data-shape="rectangle">
  <rect x="249.999" y="496.531" width="198.301" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="349.1495" y="514.981" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Mostrar: o número é ímpar</text>
</g>
<g class="node" data-id="fim" data-label="Fim" data-shape="stadium">
  <rect x="208.7255" y="581.431" width="62.69799999999999" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="240.0745" y="599.8810000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Fim</text>
</g>
</svg>